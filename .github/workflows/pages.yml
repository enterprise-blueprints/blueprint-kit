name: Check, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Allow one deployment at a time, but don't cancel one that's in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # lets configure-pages read the Pages settings
    outputs:
      pages: ${{ steps.site.outputs.on }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check that content/ matches source/
        run: pnpm content:check

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      # A repository without Pages, such as a private one on GitHub's free plan,
      # is still checked and built on each push, but not deployed.
      - name: Check whether Pages is on
        id: site
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if answer=$(gh api "repos/${{ github.repository }}/pages" --silent 2>&1); then
            echo "on=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<< "$answer"; then
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Built, not deployed::GitHub Pages isn't on for this repository, so the site was checked and built but not deployed. To deploy it, turn Pages on in Settings, with GitHub Actions as the source."
          else
            echo "$answer"
            exit 1
          fi

      # Reads the repository's Pages settings to find the base path:
      # "" for an organization site, "/repo-name" for a project site.
      - name: Configure Pages
        id: pages
        if: steps.site.outputs.on == 'true'
        uses: actions/configure-pages@v6

      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Upload Pages artifact
        if: steps.site.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Deploys a push to main, or a run started by hand on main, but never a pull
  # request, and only when Pages is on.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
