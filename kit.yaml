# Your site and what it builds on. This is the one file to change to make the
# kit yours; your packages' own details are in source/<package>/package.yaml.

site:
  # The name at the top of every page, and a sentence about what's here.
  title: My Blueprints
  description: My organization’s services, demos, and products for public-sector missions, mapped to the Enterprise Blueprints library.
  # The site's main color, for links and buttons, as a hex color.
  accent: "#0b6e69"
  # Where the site will live, if you host it yourself, with any folder it's under, such as
  # https://intranet.example.org/architecture. GitHub Pages sets this for you.
  # url: https://blueprints.example.org

library:
  # Where the library publishes its catalog, and the release your packages build on.
  # Run `pnpm sync` after changing the release, then `pnpm content:build`.
  url: https://enterprise-blueprints.github.io/
  release: 0.14.0
  # "all" gives the whole release pages here, and the site's lists a switch that narrows
  # them to your items and what they build on. Leave it out for only what they build on.
  show: all
  # The version of the library's engine, its pages and the code behind them. pnpm sync --tools sets it.
  engine: 1.2.0
